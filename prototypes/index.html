<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>uClipboard 原型</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" id="app">
      <header class="titlebar" data-tauri-drag-region>
        <div class="brand">
          <span class="brand-name">剪贴板</span>
        </div>
        <label class="search" for="searchInput">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="searchInput" type="text" placeholder="搜索…" autocomplete="off" />
        </label>
        <div class="title-actions">
          <button class="icon-btn" id="themeBtn" title="切换主题"></button>
          <button class="icon-btn" id="settingsBtn" title="设置"></button>
          <button class="icon-btn" id="moreBtn" title="更多"></button>
          <button class="icon-btn" id="hideBtn" title="隐藏（原型）"></button>
        </div>
      </header>
      <nav class="tabs" id="tabs" aria-label="分类"></nav>
      <div class="workspace">
        <section class="list" id="list" tabindex="0" aria-label="剪贴板历史"></section>
        <aside class="side-rail" aria-label="快捷操作">
          <div class="quick-rail">
            <button class="quick-btn" data-quick-action="copy" title="复制"></button>
            <button class="quick-btn" data-quick-action="paste" title="粘贴"></button>
            <button class="quick-btn" data-quick-action="pin" title="置顶"></button>
          </div>
          <div class="utility-rail">
            <button class="icon-btn rail-btn" id="settingsTextBtn" title="设置"></button>
            <button class="icon-btn rail-btn" id="clearBtn" title="清空历史"></button>
          </div>
        </aside>
        <div class="status-float" id="statusText">监控中 · 共 0 条</div>
      </div>
      <div class="settings" id="settings" hidden>
        <aside class="settings-nav">
          <button class="active" data-section="basic">基本</button>
          <button data-section="history">历史</button>
          <button data-section="privacy">隐私</button>
          <button data-section="about">关于</button>
        </aside>
        <section class="settings-body" id="settingsBody"></section>
      </div>
    </main>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="modal-backdrop" id="modal" hidden></div>
    <div class="context-menu" id="contextMenu" hidden></div>
    <div class="restore-hint" id="restoreHint" hidden>窗口已隐藏（原型）— 点击恢复</div>
    <script src="mock-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
